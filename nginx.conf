# Nginx config for assetbookintool.com
# Place at: /etc/nginx/sites-available/prestige-assets
# Then: sudo ln -s /etc/nginx/sites-available/prestige-assets /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name assetbookintool.com www.assetbookintool.com;

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name assetbookintool.com www.assetbookintool.com;

    # SSL — managed by Certbot (run: sudo certbot --nginx -d assetbookintool.com)
    ssl_certificate /etc/letsencrypt/live/assetbookintool.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/assetbookintool.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Increase for photo uploads (up to 80 photos)
    client_max_body_size 50M;

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }
}
