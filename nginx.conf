# Nginx config for assetbookintool.com
# Place at: /etc/nginx/sites-available/prestige-assets
# After SSL: run "certbot --nginx -d assetbookintool.com -d www.assetbookintool.com"

server {
    listen 80;
    server_name assetbookintool.com www.assetbookintool.com;

    # Increase for photo uploads (up to 80 photos)
    client_max_body_size 50M;

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }
}
